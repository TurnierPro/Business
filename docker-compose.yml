# Levarex OS bei Hostinger (ein VPS): Caddy (HTTPS), App, PostgreSQL, n8n.
# Geheimnisse stehen in der .env auf dem Server (Vorlage: deploy/server.env.example), nie hier und nie im Git.
#
# Netze (Trennung):
#   db-netz  – nur App und PostgreSQL. n8n ist NICHT drin: n8n kennt weder Datenbank noch Zugangsdaten.
#   web-netz – Caddy, App, n8n. n8n spricht mit Levarex OS nur über http://app:3000/api/v1 mit eigenem API-Schlüssel.
# Von außen erreichbar ist nur Caddy (Ports 80 und 443).

services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      OS_DOMAIN: ${OS_DOMAIN}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN}
      N8N_DOMAIN: ${N8N_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-daten:/data
      - caddy-config:/config
    networks: [web-netz]
    depends_on: [app]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://levarex:${POSTGRES_PASSWORD}@db:5432/levarex
      BASE_URL: https://${OS_DOMAIN}
      PORTAL_URL: https://${PORTAL_DOMAIN}
      LEVAREX_HOSTS: ${OS_DOMAIN},${PORTAL_DOMAIN}
      DATA_DIR: /data
      N8N_DATEN: /n8n-daten
    volumes:
      - levarex-daten:/data
      # Nur für die tägliche Sicherung der n8n-Abläufe (und die Wiederherstellung)
      - n8n-daten:/n8n-daten
    networks: [db-netz, web-netz]
    depends_on: [db]

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: levarex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: levarex
    volumes:
      - levarex-db:/var/lib/postgresql/data
    networks: [db-netz]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U levarex"]
      interval: 30s

  n8n:
    # Version fest eintragen (N8N_VERSION in der .env) und nur bewusst erhöhen (Runbook „Updates“)
    image: n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      # Sicherheit: keine Community-Knoten, kein Zugriff auf Umgebungsvariablen aus Abläufen, keine Telemetrie
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "true"
      N8N_RUNNERS_ENABLED: "true"
      # Levarex OS erreicht n8n intern unter http://app:3000/api/v1 (Schlüssel im n8n-Tresor, nicht hier)
    volumes:
      - n8n-daten:/home/node/.n8n
    networks: [web-netz]

networks:
  db-netz:
    internal: true
  web-netz:

volumes:
  levarex-daten:
  levarex-db:
  n8n-daten:
  caddy-daten:
  caddy-config:
