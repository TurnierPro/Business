# Für Coolify: App + PostgreSQL. Umgebungsvariablen in Coolify setzen, nicht hier.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://nexova:${POSTGRES_PASSWORD}@db:5432/nexova
      BASE_URL: ${BASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - nexova-daten:/data
    depends_on:
      - db
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nexova
    volumes:
      - nexova-db:/var/lib/postgresql/data
volumes:
  nexova-daten:
  nexova-db:
