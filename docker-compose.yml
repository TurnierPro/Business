# Server (Hostinger): App + PostgreSQL. Umgebungsvariablen in der .env auf dem Server setzen, nicht hier. n8n und Caddy folgen mit Etappe 8.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://levarex:${POSTGRES_PASSWORD}@db:5432/levarex
      BASE_URL: ${BASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - levarex-daten:/data
    depends_on:
      - db
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: levarex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: levarex
    volumes:
      - levarex-db:/var/lib/postgresql/data
volumes:
  levarex-daten:
  levarex-db:
