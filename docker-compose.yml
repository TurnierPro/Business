# Für Coolify: App + PostgreSQL. Umgebungsvariablen in Coolify setzen, nicht hier.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://stelax:${POSTGRES_PASSWORD}@db:5432/stelax
      BASE_URL: ${BASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - stelax-daten:/data
    depends_on:
      - db
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: stelax
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stelax
    volumes:
      - stelax-db:/var/lib/postgresql/data
volumes:
  stelax-daten:
  stelax-db:
